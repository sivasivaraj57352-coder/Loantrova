const NT={"NMDFC Education Loan":"Minority students in professional or technical courses. Up to ₹20 lakh in India and ₹30 lakh abroad at about 3% (family income up to ₹3 lakh) or 5% (₹3–8 lakh). This is the route now that the Padho Pardesh interest subsidy has been discontinued.","Virasat Loan for Minority Artisans (NMDFC/TAMCO)":"Minority artisans and traditional craftsmen, family income up to ₹8 lakh. Loans up to about ₹10 lakh at concessional rates. Confirm limits and rates with NMDFC or TAMCO.","TABCEDCO Milch Animal Loan (Aavin)":"BC/MBC/denotified community members buying milch animals through Aavin milk societies. Same eligibility as TABCEDCO (age 18–60, income up to ₹3 lakh). Limits are listed on the TABCEDCO site.","PM Surya Ghar Rooftop Solar Loan":"Households installing rooftop solar. Central subsidy plus a low-interest bank loan for the remaining cost. Apply on the national portal; confirm the current subsidy and loan terms before applying.","PM FME Micro Food Processing Loan":"Micro food-processing units (existing or new). Credit-linked capital subsidy of 35% of project cost, with a cap per unit, plus a bank loan. Confirm current limits on the PM FME portal.","PM Mudra Yojana (Shishu/Kishor/Tarun)":"Collateral-free loans for non-farm income activities: Shishu up to ₹50,000, Kishor up to ₹5 lakh, Tarun up to ₹10 lakh, Tarun Plus up to ₹20 lakh.","PMEGP Subsidised Business Loan":"New units only. Project cost up to ₹50 lakh (manufacturing) or ₹20 lakh (service). Subsidy 15–35%; own share 10% (5% for special categories). Age 18+, no income limit; 8th pass needed above ₹10 lakh (manufacturing) or ₹5 lakh (service).","Stand-Up India":"SC/ST and/or women, age 18+, new (greenfield) enterprise. Bank loan ₹10 lakh to ₹1 crore. It was extended only to FY2025 and a revamped version was announced in 2026, so confirm it is open.","PM SVANidhi":"Street vendors, age 18+, no upper age. Collateral-free ₹15,000 (12 months), then ₹25,000, then ₹50,000 after timely repayment. 7% interest subsidy. Needs vending certificate, ID card or local verification.","PM Vishwakarma":"Artisans in the notified traditional trades, age 18+. Skill training, toolkit support, then collateral-free ₹1 lakh and ₹2 lakh loans at 5% interest. Confirm trade list on the portal.","CGTMSE Collateral-free Credit Guarantee":"Guarantee cover that lets banks lend to micro and small enterprises without collateral. Covered amount and fee are set by CGTMSE, so ask the bank for the current ceiling.","Udyami Mitra MSME Loans":"SIDBI portal to apply for MSME loans through banks. Loan size, rate and eligibility depend on the lender and scheme chosen.","PM-Vidyalaxmi Education Loan":"Students admitted to listed top institutions (QHEIs). Collateral and guarantor free up to ₹10 lakh; 75% government guarantee on loans up to ₹7.5 lakh. The central government pays the full interest during the moratorium (course period plus one year) for family income up to ₹4.5 lakh. 3% interest subvention for family income up to ₹8 lakh. No income limit for the loan itself.","Central Sector Interest Subsidy (Education)":"Full interest subsidy during course plus one year for family income up to ₹4.5 lakh, for technical or professional courses at approved institutions. Loan up to ₹10 lakh.","NBCFDC Education Loan":"BC/MBC students, family income up to ₹3 lakh (NBCFDC site). Up to ₹25 lakh at 8% for the student; repayment up to 10 years including a 5-year moratorium. Applied through the state channelising agency (TABCEDCO in Tamil Nadu).","NSFDC Education Loan":"SC students, family income up to ₹5 lakh (from 7 Jan 2026). Up to ₹40 lakh or 90% of the course fee at about 6.5%. Applied through the state channelising agency (TAHDCO in Tamil Nadu).","Kisan Credit Card":"Owner farmers, tenants, sharecroppers and SHG/JLG members. Interest subvention on crop loans up to ₹5 lakh (7%, effectively 4% on prompt repayment). Collateral-free up to ₹2 lakh.","Agriculture Infrastructure Fund":"Farmers, FPOs and agri-entrepreneurs for post-harvest and community farming assets. 3% interest subvention on loans up to ₹2 crore for up to 7 years.","PM Matsya Sampada Yojana (Fisheries)":"Fishers, fish farmers and fisheries entrepreneurs. Subsidy on project cost, generally 40% (60% for SC/ST/women); the rest through a bank loan.","Dairy and Livestock Infrastructure Loans (AHIDF)":"Dairy and livestock units. Interest subvention under the Animal Husbandry Infrastructure Development Fund through banks. The older DEDS name is no longer used; confirm the current scheme with the Department of Animal Husbandry and Dairying.","PMAY-Urban Interest Subsidy":"Urban families with no pucca house. Income bands: EWS up to ₹3 lakh, LIG ₹3–6 lakh, MIG ₹6–9 lakh. Interest subsidy on a home loan; confirm the current subsidy amount.","PMAY-Gramin":"Rural households without a pucca house, selected through the Awaas+ survey and Gram Sabha. Households with any member earning over ₹15,000 a month (₹1.8 lakh a year) are excluded. ₹1.2 lakh assistance in plain areas, plus an optional loan up to ₹70,000.","NSFDC Loans":"SC families with income up to ₹5 lakh (from 7 Jan 2026). Term loan for projects above ₹1.40 lakh, up to ₹45 lakh at 8% for up to 7 years. Micro-finance up to ₹1.25 lakh at 6.5%.","NSTFDC Loans":"ST families through the state channelising agency. Loan size and family income ceiling follow NSTFDC norms; confirm locally.","NBCFDC Loans":"BC/MBC/denotified communities, family income up to ₹3 lakh (NBCFDC site). Loans up to ₹25 lakh: 7% up to ₹1.25 lakh and 8% above that; NBCFDC funds 85%. A 1% timely-payment rebate applies.","NMDFC Loans":"Minority communities. Credit Line 1: family income up to ₹3 lakh, loans up to about ₹20 lakh at about 6%. Credit Line 2: income up to ₹8 lakh, higher limit at a slightly higher rate. Confirm limits and rates with the channelising agency.","DAY-NRLM SHG Bank Linkage":"Women members of SHGs promoted under NRLM. Bank credit linked to the SHG’s grading, with interest concessions as notified.","PM Jan Dhan Overdraft":"Jan Dhan account holders aged 18–65 with satisfactory account operation. Overdraft up to ₹10,000.","PM-KUSUM Solar Pump Loan":"Farmers installing solar pumps. Central and state subsidy; the farmer’s share can be bank-financed. In Tamil Nadu a 70% subsidy / 30% farmer share has been reported.","Pashu Kisan Credit Card (Livestock)":"Livestock, dairy and fisheries farmers. Credit card for working capital; interest subvention applies up to ₹5 lakh and collateral-free up to ₹2 lakh.","SIDBI Mahila Udyam Nidhi":"Women-owned small enterprises. Loan size and rate are set by SIDBI and the partner bank.","TAHDCO Loans":"SC/ST applicants in Tamil Nadu. Subsidy-linked loans for income-generating projects. TAHDCO’s subsidy-linked schemes (such as Vetri Thozhil Munaivor) allow family income up to ₹3 lakh. SC applicants may also use NSFDC loans (₹5 lakh ceiling). Confirm with TAHDCO.","TABCEDCO Individual Loan":"BC/MBC/denotified communities in Tamil Nadu, age 18–60, family income up to ₹3 lakh, one loan per family. Loans up to ₹25 lakh at 7% (up to ₹1.25 lakh) or 8%; repayment 1.5–6 years. Funding: NBCFDC 85%, TABCEDCO 10%, you 5%. Apply online on the TABCEDCO site.","TAMCO Loans":"Minority communities in Tamil Nadu. Term 1: family income up to ₹3 lakh, up to ₹20 lakh at about 6%. Term 2: income up to ₹8 lakh, up to ₹30 lakh at about 8% (men) or 6% (women). Also SHG, education and Virasat loans. Confirm at TAMCO.","Annal Ambedkar Business Champions Scheme (AABCS)":"Tamil Nadu MSME department scheme for SC/ST entrepreneurs: bank loan with capital subsidy and interest support. No family income ceiling. Confirm current limits on msmeonline.tn.gov.in.","NEEDS Entrepreneur Scheme":"First-generation entrepreneurs, Tamil Nadu resident for 3+ years. Project cost ₹10 lakh to ₹5 crore; 25% capital subsidy up to ₹75 lakh plus 3% interest subvention. Age 21–45 (up to 55 for women, SC/ST/BC/MBC, minorities). No income ceiling.","UYEGP Youth Employment Scheme":"Tamil Nadu resident for 3+ years, 8th pass. Age 18–45 (up to 55 for special categories). Family income below ₹5 lakh. Project cost up to ₹15 lakh; 25% subsidy up to ₹3.75 lakh; own contribution 10% (5% for special categories).","TN Co-operative Crop Loan":"Farmers who are members of primary agricultural co-operative societies. Short-term crop loans with interest concessions for timely repayment.","TN Co-operative Jewel Loan":"Gold-pledge loans from co-operative banks. Loan amount depends on the gold value and the society’s policy.","Mathi SHG Loan (TNSRLM)":"Women SHG members under the Tamil Nadu rural livelihood mission. Bank linkage loans sized by the SHG’s grading.","TIIC Industrial Loan":"Term loans for industrial and MSME units from TIIC. Sanction follows project appraisal."};
